<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>F1 Strategie-Manager</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F1 Manager">
<meta name="theme-color" content="#090b10">
<style>html, body { background: #090b10; overscroll-behavior: none; touch-action: none; }</style>
<script>
(function () {
  var ua = navigator.userAgent;
  var isIpad = /iPad/.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  var isPhone = /iPhone|Mobile/.test(ua) && !isIpad;
  var isTouch = isIpad || isPhone || /Android/.test(ua);
  // Render-Auflösung: Handys scharf (2x), Tablets etwas sparsamer, alte iPads 1,25x (sonst "WebGL context lost").
  // Wählbar im Spiel (Schärfe) - die Wahl wird im Browser gespeichert.
  var cap = isPhone ? 2 : (isIpad ? 1.25 : (isTouch ? 1.5 : 2));
  var stored = 0;
  try { stored = parseFloat(localStorage.getItem("f1dpr")) || 0; } catch (x) {}
  if (/[?&]lite=1/.test(location.search)) { cap = 1; }
  else if (stored >= 1 && stored <= 3) { cap = stored; }
  window.f1DprCap = cap;
  var dpr = window.devicePixelRatio || 1;
  if (dpr > cap) { try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return cap; } }); } catch (x) {} }
  // Bei verlorenem WebGL-Kontext Seite automatisch neu laden (maximal zweimal je Sitzung); Spielstand ist gespeichert.
  window.addEventListener("webglcontextlost", function (e) {
    var n = +(sessionStorage.getItem("f1reload") || 0);
    if (n < 2) { sessionStorage.setItem("f1reload", String(n + 1)); location.reload(); }
  }, true);
  // App-Installation (Chrome/Edge/Android): Ereignis merken, das Spiel löst es per Knopf aus.
  window.f1CanInstall = false;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.f1InstallEvt = e; window.f1CanInstall = true; });
  window.addEventListener("appinstalled", function () { window.f1CanInstall = false; window.f1InstallEvt = null; });
  window.f1Standalone = function () {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  };
  window.f1Install = function () { if (window.f1InstallEvt) { window.f1InstallEvt.prompt(); } };
  window.f1SetDpr = function (v) { try { localStorage.setItem("f1dpr", String(v)); } catch (x) {} location.reload(); };
  function info() {
    var gl2 = "nein";
    try { gl2 = document.createElement("canvas").getContext("webgl2") ? "ja" : "nein"; } catch (x) { gl2 = "Fehler"; }
    return "WebGL2: " + gl2 + " | IndexedDB: " + (window.indexedDB ? "ja" : "nein") + " | DPR: " + window.devicePixelRatio + " | " + navigator.userAgent;
  }
  function show(t) {
    var d = document.getElementById("f1err");
    if (!d) {
      d = document.createElement("pre");
      d.id = "f1err";
      d.style.cssText = "position:fixed;left:0;right:0;top:0;max-height:55%;overflow:auto;margin:0;padding:8px;background:#400;color:#fff;font:12px/1.3 monospace;z-index:99999;white-space:pre-wrap";
      d.textContent = "Diagnose (bitte Screenshot schicken)" + String.fromCharCode(10) + info() + String.fromCharCode(10);
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent += t + String.fromCharCode(10);
  }
  window.addEventListener("error", function (e) {
    show("Fehler: " + e.message + " (" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + ")" + (e.error && e.error.stack ? String.fromCharCode(10) + e.error.stack : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    show("Fehler (Promise): " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13614816,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
