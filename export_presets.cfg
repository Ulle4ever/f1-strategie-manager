exclude_filter="screenshots/*, tools/*, README.md, .gitignore"
export_path="export/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"F1 Manager\">\n<meta name=\"theme-color\" content=\"#090b10\">\n<style>html, body { background: #090b10; overscroll-behavior: none; touch-action: none; }</style>\n<script>\n(function () {\n  var ua = navigator.userAgent;\n  var isIpad = /iPad/.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));\n  var isPhone = /iPhone|Mobile/.test(ua) && !isIpad;\n  var isTouch = isIpad || isPhone || /Android/.test(ua);\n  // Render-Auflösung: Handys scharf (2x), Tablets etwas sparsamer, alte iPads 1,25x (sonst \"WebGL context lost\").\n  // Wählbar im Spiel (Schärfe) - die Wahl wird im Browser gespeichert.\n  var cap = isPhone ? 2 : (isIpad ? 1.25 : (isTouch ? 1.5 : 2));\n  var stored = 0;\n  try { stored = parseFloat(localStorage.getItem(\"f1dpr\")) || 0; } catch (x) {}\n  if (/[?&]lite=1/.test(location.search)) { cap = 1; }\n  else if (stored >= 1 && stored <= 3) { cap = stored; }\n  window.f1DprCap = cap;\n  var dpr = window.devicePixelRatio || 1;\n  if (dpr > cap) { try { Object.defineProperty(window, \"devicePixelRatio\", { get: function () { return cap; } }); } catch (x) {} }\n  // Bei verlorenem WebGL-Kontext Seite automatisch neu laden (maximal zweimal je Sitzung); Spielstand ist gespeichert.\n  window.addEventListener(\"webglcontextlost\", function (e) {\n    var n = +(sessionStorage.getItem(\"f1reload\") || 0);\n    if (n < 2) { sessionStorage.setItem(\"f1reload\", String(n + 1)); location.reload(); }\n  }, true);\n  // App-Installation (Chrome/Edge/Android): Ereignis merken, das Spiel löst es per Knopf aus.\n  window.f1CanInstall = false;\n  window.addEventListener(\"beforeinstallprompt\", function (e) { e.preventDefault(); window.f1InstallEvt = e; window.f1CanInstall = true; });\n  window.addEventListener(\"appinstalled\", function () { window.f1CanInstall = false; window.f1InstallEvt = null; });\n  window.f1Standalone = function () {\n    return (window.matchMedia && window.matchMedia(\"(display-mode: standalone)\").matches) || window.navigator.standalone === true;\n  };\n  window.f1Install = function () { if (window.f1InstallEvt) { window.f1InstallEvt.prompt(); } };\n  window.f1SetDpr = function (v) { try { localStorage.setItem(\"f1dpr\", String(v)); } catch (x) {} location.reload(); };\n  function info() {\n    var gl2 = \"nein\";\n    try { gl2 = document.createElement(\"canvas\").getContext(\"webgl2\") ? \"ja\" : \"nein\"; } catch (x) { gl2 = \"Fehler\"; }\n    return \"WebGL2: \" + gl2 + \" | IndexedDB: \" + (window.indexedDB ? \"ja\" : \"nein\") + \" | DPR: \" + window.devicePixelRatio + \" | \" + navigator.userAgent;\n  }\n  function show(t) {\n    var d = document.getElementById(\"f1err\");\n    if (!d) {\n      d = document.createElement(\"pre\");\n      d.id = \"f1err\";\n      d.style.cssText = \"position:fixed;left:0;right:0;top:0;max-height:55%;overflow:auto;margin:0;padding:8px;background:#400;color:#fff;font:12px/1.3 monospace;z-index:99999;white-space:pre-wrap\";\n      d.textContent = \"Diagnose (bitte Screenshot schicken)\" + String.fromCharCode(10) + info() + String.fromCharCode(10);\n      (document.body || document.documentElement).appendChild(d);\n    }\n    d.textContent += t + String.fromCharCode(10);\n  }\n  window.addEventListener(\"error\", function (e) {\n    show(\"Fehler: \" + e.message + \" (\" + (e.filename || \"\") + \":\" + (e.lineno || \"\") + \":\" + (e.colno || \"\") + \")\" + (e.error && e.error.stack ? String.fromCharCode(10) + e.error.stack : \"\"));\n  });\n  window.addEventListener(\"unhandledrejection\", function (e) {\n    show(\"Fehler (Promise): \" + (e.reason && e.reason.stack ? e.reason.stack : e.reason));\n  });\n})();\n</script>"
