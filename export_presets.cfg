[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="screenshots/*, tools/*, README.md, .gitignore"
export_path="export/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"theme-color\" content=\"#090b10\">\n<style>html, body { background: #090b10; overscroll-behavior: none; touch-action: none; }</style>\n<script>\n(function () {\n  // Render-Auflösung begrenzen: hohe Pixeldichte (iPad/Handy) frisst GPU-Speicher und führt in Safari zu \"WebGL context lost\".\n  var dpr = window.devicePixelRatio || 1;\n  var cap = /iPad|iPhone|Android|Mobile/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) ? 1.25 : 2;\n  if (dpr > cap) { try { Object.defineProperty(window, \"devicePixelRatio\", { get: function () { return cap; } }); } catch (x) {} }\n  // Bei verlorenem WebGL-Kontext Seite automatisch neu laden (maximal zweimal je Sitzung); Spielstand ist gespeichert.\n  window.addEventListener(\"webglcontextlost\", function (e) {\n    var n = +(sessionStorage.getItem(\"f1reload\") || 0);\n    if (n < 2) { sessionStorage.setItem(\"f1reload\", String(n + 1)); location.reload(); }\n  }, true);\n  function info() {\n    var gl2 = \"nein\";\n    try { gl2 = document.createElement(\"canvas\").getContext(\"webgl2\") ? \"ja\" : \"nein\"; } catch (x) { gl2 = \"Fehler\"; }\n    return \"WebGL2: \" + gl2 + \" | IndexedDB: \" + (window.indexedDB ? \"ja\" : \"nein\") + \" | DPR: \" + window.devicePixelRatio + \" | \" + navigator.userAgent;\n  }\n  function show(t) {\n    var d = document.getElementById(\"f1err\");\n    if (!d) {\n      d = document.createElement(\"pre\");\n      d.id = \"f1err\";\n      d.style.cssText = \"position:fixed;left:0;right:0;top:0;max-height:55%;overflow:auto;margin:0;padding:8px;background:#400;color:#fff;font:12px/1.3 monospace;z-index:99999;white-space:pre-wrap\";\n      d.textContent = \"Diagnose (bitte Screenshot schicken)\" + String.fromCharCode(10) + info() + String.fromCharCode(10);\n      (document.body || document.documentElement).appendChild(d);\n    }\n    d.textContent += t + String.fromCharCode(10);\n  }\n  window.addEventListener(\"error\", function (e) {\n    show(\"Fehler: \" + e.message + \" (\" + (e.filename || \"\") + \":\" + (e.lineno || \"\") + \":\" + (e.colno || \"\") + \")\" + (e.error && e.error.stack ? String.fromCharCode(10) + e.error.stack : \"\"));\n  });\n  window.addEventListener(\"unhandledrejection\", function (e) {\n    show(\"Fehler (Promise): \" + (e.reason && e.reason.stack ? e.reason.stack : e.reason));\n  });\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
